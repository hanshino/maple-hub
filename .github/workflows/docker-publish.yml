name: Build and Push Docker Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Native arm64 runner (free for public repos). The only deployment target
    # is a single arm64 (Graviton) host, so we build for arm64 directly
    # instead of multi-arch — cross-building amd64+arm64 under QEMU would
    # slow every build for a platform nothing runs on.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_UMAMI_URL=${{ vars.NEXT_PUBLIC_UMAMI_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrator
          cache-from: type=gha

      # Deployment is pull-based: the host itself periodically runs
      # `docker compose pull && docker compose up -d`. CI's job ends at
      # publishing the image to GHCR, so all we report here is that the
      # publish happened — not that any deployment occurred.
      #
      # A plain curl call replaces the Ilshidur/action-discord Docker
      # container action: its base image (mhart/alpine-node:12.19.1,
      # unmaintained since 2019) has no arm64 manifest and fails outright
      # on this arm64 runner. curl also removes any third-party code
      # execution against our webhook secret, not just pins it.
      - name: Discord notification
        run: |
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\": \"${{ github.repository }} 已發佈 arm64 image\"}" \
            "${{ secrets.DISCORD_WEBHOOK }}"
